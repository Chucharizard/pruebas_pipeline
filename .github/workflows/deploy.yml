name: React CI y GitHub Pages

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Comprobar y compilar React
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar el código
        run: npm run lint
      - name: Compilar para GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /pruebas_pipeline/
      - name: Subir los archivos de la web
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    # Activar PAGES_ENABLED cuando Settings > Pages permita publicar el sitio.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Desplegar la web
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mostrar la URL publicada
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '### Web publicada\n\n%s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
