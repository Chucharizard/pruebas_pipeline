name: Deploy pagina estatica en pages

on:
  # Cuando se hace push a la rama main
  push:
    branches: ["main"]
  # Ejecutar manualmente desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

# Solo permite un despliegue a la vez
concurrency:
  group: "deploy-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Revision de codigos y archivos
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Preparacion de GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Carga de los archivos de la web (index.html en la raiz)
      - name: Carga artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      # 4. Desplegar los archivos en GitHub Pages
      - name: Desplegar en github pages
        id: deployment
        uses: actions/deploy-pages@v4
